name: Build & Release

# 纯手动触发：在仓库 Actions 页手动运行。
# 填写版本号后构建；勾选"发布"则额外生成对应版本的 GitHub Release。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如 1.1.0)'
        required: true
        type: string
      publish:
        description: '构建成功后发布 GitHub Release'
        required: false
        default: false
        type: boolean

env:
  GRADLE_OPTS: -Dorg.gradle.console=plain

jobs:
  build:
    name: Build (1.7.10)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # RetroFuturaGradle 2.0.2 的插件类以 Java 25 编译(class file v69)，
      # 因此 Gradle 运行环境必须是 JDK 25；编译 1.7.10 mod 用的 Java 8 工具链
      # 由 foojay 自动下载供应，两者互不冲突。
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -PmodVersion="${{ inputs.version }}" --stacktrace

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: fkcac-1.7.10
          path: |
            build/libs/*.jar
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: fkcac-1.7.10
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: FKCAC v${{ inputs.version }}
          body: |
            FKCAC ${{ inputs.version }} (Minecraft 1.7.10 / Forge)
          generate_release_notes: true
          files: dist/**/*.jar